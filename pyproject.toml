[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodes-cloudmail"
version = "0.4.0"
description = "Nodes with Cloud Mail 3.0.0, Linux and Docker support"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "requests>=2.28",
  "DrissionPage>=4.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]
tools = ["curl_cffi>=0.6"]

[project.scripts]
nodes = "nodes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nodes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
