[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodes-cloudmail"
version = "0.1.1"
description = "Nodes with Cloud Mail 3.0.0, Linux and Docker support"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.28",
  "DrissionPage>=4.1",
  "PyJWT>=2.8",
  "curl_cffi>=0.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[tool.hatch.build.targets.wheel]
only-include = ["proxyscrape_register.py", "proxyscrape_auth.py", "filter_xai_proxies.py", "cloud_mail.py", "nodes_config.py", "browser_runtime.py", "proxy_service.py", "turnstilePatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
