name: CI and GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dnslin/nodes

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Offline tests
        run: python -m pytest -q
      - name: Lint, compile and build
        if: matrix.python == '3.12'
        run: |
          python -m ruff check .
          python -m compileall -q src tests
          sh -n scripts/run-docker.sh
          python -m build

  docker-check:
    name: Docker ${{ matrix.arch }}
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nodes:ci
          cache-from: type=gha,scope=nodes-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nodes-${{ matrix.arch }}
      - name: Check container startup without external services
        run: |
          docker run --rm nodes:ci nodes --help
          docker run --rm nodes:ci python -c 'import nodes, DrissionPage, curl_cffi'

  publish-images:
    name: Publish ${{ matrix.arch }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nodes:ci
          cache-from: type=gha,scope=nodes-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nodes-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Check container startup without external services
        run: |
          docker run --rm nodes:ci nodes --help
          docker run --rm nodes:ci python -c 'import nodes, DrissionPage, curl_cffi'
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push checked image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag nodes:ci "$IMAGE:sha-${GITHUB_SHA}-${ARCH}"
          docker push "$IMAGE:sha-${GITHUB_SHA}-${ARCH}"

  publish:
    name: Publish multi-platform manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Generate version tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Require a semantic version
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: test -n "$TAGS"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge checked architectures and verify published platforms
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-${GITHUB_SHA}-amd64" \
            "$IMAGE:sha-${GITHUB_SHA}-arm64"
          while IFS= read -r tag; do
            docker buildx imagetools inspect --raw "$tag" | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] |
              (index("amd64") != null) and (index("arm64") != null)
            '
          done <<< "$TAGS"
